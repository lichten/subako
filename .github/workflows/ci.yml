# PR / push ごとのビルドとテスト (docs/release-plan.md §4-3)
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: .NET build + test
        run: dotnet test viewer/TweetViewer.Tests/TweetViewer.Tests.csproj -c Release

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Python tests
        run: |
          pip install -r requirements-dev.txt
          pytest

  test-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # ランナーに SwiftLint は無いため、Releases のポータブル版をバージョン固定で
      # 取得する (イメージ更新で新ルールが突然発火するのも防げる)。build より先に置いて fail-fast
      - name: SwiftLint
        working-directory: mac
        run: |
          curl -sSL -o /tmp/swiftlint.zip https://github.com/realm/SwiftLint/releases/download/0.65.0/portable_swiftlint.zip
          unzip -q -o /tmp/swiftlint.zip -d /tmp/swiftlint
          /tmp/swiftlint/swiftlint version
          /tmp/swiftlint/swiftlint lint --strict --reporter github-actions-logging

      # デフォルトの Xcode 16.x は Swift 6.1 のため swift-tools-version 6.2 の
      # マニフェストを読めない。ランナー同梱の Xcode 26 系の最新を選ぶ
      - name: Select Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"

      - name: Swift build + test (SubakoCore)
        working-directory: mac
        run: swift test

      # xcodeproj は手書きのため、設定ドリフトやパッケージ参照の破損を CI で検知する。
      # ad-hoc 署名 (CODE_SIGN_IDENTITY=-) なので証明書は不要
      - name: Xcode project build (Subako.app)
        working-directory: mac
        run: >
          xcodebuild -project Subako.xcodeproj -scheme Subako
          -configuration Debug -destination "platform=macOS"
          -derivedDataPath "$RUNNER_TEMP/DerivedData" build
